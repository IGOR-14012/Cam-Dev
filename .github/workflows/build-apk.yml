name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Pinned so the runner image (with Android SDK) does not change under us
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Installs Gradle itself, so the gradlew wrapper files are not needed
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # The project was uploaded as a zip, so extract it first
      - name: Unzip project
        run: |
          if [ -f WifiCamViewer.zip ]; then
            mkdir -p unzipped
            unzip -q WifiCamViewer.zip -d unzipped
          fi

      # Locate the folder that contains settings.gradle.kts
      - name: Find project directory
        id: find
        run: |
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$F" ]; then
            echo "settings.gradle.kts not found. Files in the repository:"
            find . -not -path './.git/*' -type f | sort
            exit 1
          fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
